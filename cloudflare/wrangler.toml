name = "api-usage-stat"
main = "worker.js"
compatibility_date = "2026-04-01"
# 保持 workers.dev 域名可用（部分用户可直连）；如需关闭改为 false
workers_dev = true
# 关闭每次上传生成的预览 URL，减少无意义的外部暴露
preview_urls = false

# 看板页与自托管的图表库都作为文本模块打包进 Worker，不需要额外的静态资源托管
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# 自托管 ECharts：从自己的域名提供（/vendor/echarts.js），避免看板依赖第三方 CDN
[[rules]]
type = "Text"
globs = ["**/vendor/*.js"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "api_usage_stat"
# D1 数据库 ID 属于账号私有信息，请勿提交真实值。
# 做法：把本文件复制为 wrangler.local.toml（已在 .gitignore 中忽略），填入 `npx wrangler d1 create api_usage_stat`
# 返回的 database_id，然后使用 `npx wrangler deploy -c wrangler.local.toml` 部署。
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 每月 1 号 03:00 UTC 清理超过保留期的逐设备日数据（device 快照表长期保留）
[triggers]
crons = ["0 3 1 * *"]

# 可选：绑定自定义域名后，把下面的注释打开并修改 pattern，客户端常量同步改成该域名
# [[routes]]
# pattern = "stat.example.com"
# custom_domain = true

[observability]
enabled = false
